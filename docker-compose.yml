services:

  server:
    image: datastewardshipwizard/wizard-server:${DSW_VERSION}
    platform: linux/amd64
    restart: always
    # Local demo only; put an HTTPS proxy in front for shared deployments.
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      create-bucket:
        condition: service_completed_successfully
    volumes:
      - ./config/application.resolved.yml:/app/config/application.yml:ro

  client:
    image: datastewardshipwizard/wizard-client:${DSW_VERSION}
    restart: always
    # Local demo only; put an HTTPS proxy in front for shared deployments.
    ports:
      - 127.0.0.1:8080:8080
    environment:
      API_URL: ${CLIENT_API_URL}

  docworker:
    image: datastewardshipwizard/document-worker:${DSW_VERSION}
    restart: always
    depends_on:
      create-bucket:
        condition: service_completed_successfully
    volumes:
      - ./config/application.resolved.yml:/app/config/application.yml:ro

  mailer:
    image: datastewardshipwizard/mailer:${DSW_VERSION}
    restart: always
    depends_on:
      - postgres
      - server
    volumes:
      - ./config/application.resolved.yml:/app/config/application.yml:ro

  postgres:
    image: postgres:${POSTGRES_VERSION}
    restart: always
    # Change defaults before using this outside a local POC.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data

  garage:
    image: dxflrs/garage:${GARAGE_VERSION}
    restart: always
    # Publish only the S3 endpoint on the host so both containers and the browser can reach it.
    ports:
      - 9000:3900
    # Change these defaults before sharing or reusing this setup.
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN}
    volumes:
      - ./config/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage

  create-bucket:
    image: python:3.13-alpine
    restart: "no"
    depends_on:
      garage:
        condition: service_started
    entrypoint: ["python3", "/script/create-bucket.py"]
    environment:
      GARAGE_ADMIN_URL: ${GARAGE_ADMIN_URL}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_ZONE: ${GARAGE_ZONE}
      GARAGE_CAPACITY: ${GARAGE_CAPACITY}
      GARAGE_KEY_NAME: ${GARAGE_KEY_NAME}
      S3_URL: ${S3_URL}
      S3_BUCKET: ${S3_BUCKET}
      S3_USERNAME: ${S3_USERNAME}
      S3_PASSWORD: ${S3_PASSWORD}
    volumes:
      - ./script/create-bucket.py:/script/create-bucket.py:ro

volumes:
  db-data:
  garage-data:
